<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>რელიეფი – მაინდ მეპი</title>
<style>
  :root{
    --bg:#f7f5f0; --ink:#1f2933;
    --endo:#c0392b; --endo-soft:#fbe9e7;
    --exo:#1f78b4;  --exo-soft:#e3f1fa;
    --forms:#2f855a; --forms-soft:#e6f4ea;
    --mix:#6b46c1;  --mix-soft:#efe9fb;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans Georgian","BPG Nino Mtavruli","Sylfaen",system-ui,sans-serif;}
  .layout{display:flex;height:100vh}
  .main{flex:1;min-width:0;overflow:auto}
  h1{text-align:center;font-size:22px;margin:18px 12px 4px}
  p.hint{text-align:center;margin:0 12px 10px;font-size:13px;color:#52606d}
  .wrap{padding:10px 20px 30px}
  .map{position:relative;display:flex;align-items:center;justify-content:center;gap:56px;min-width:1600px;margin:0 auto}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg.links path{fill:none;stroke-width:2;opacity:.55}
  .side{display:flex;flex-direction:column;gap:46px}
  .block{display:flex;align-items:center;gap:56px}
  .factors{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:40px}
  .landforms{display:flex;flex-direction:column;gap:5px}
  .node{position:relative;z-index:1;border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.3;cursor:pointer;
    transition:box-shadow .15s, transform .15s}
  .node:hover{box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .node:focus-visible{outline:3px solid #f6ad55}
  .node.selected{box-shadow:0 0 0 3px #f6ad55, 0 4px 14px rgba(0,0,0,.25);transform:scale(1.03)}
  .center{background:#1f2933;color:#fff;font-size:22px;font-weight:700;text-align:center;
    width:170px;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .group{width:210px;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:14px}
  .group.endo{background:var(--endo)} .group.exo{background:var(--exo)}
  .group.forms{background:var(--forms)} .group.mix{background:var(--mix)}
  .factor{width:205px;font-weight:700;border:2px solid;background:#fff;user-select:none;padding-right:30px}
  .factor small{display:block;font-weight:400;font-size:11.5px;color:#52606d;margin-top:3px}
  .factor.endo{border-color:var(--endo);background:var(--endo-soft)}
  .factor.exo{border-color:var(--exo);background:var(--exo-soft)}
  .factor.forms{border-color:var(--forms);background:var(--forms-soft)}
  .factor.mix{border-color:var(--mix);background:var(--mix-soft)}
  .factor.off{opacity:.6}
  .fold{position:absolute;top:6px;right:6px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(0,0,0,.08);color:#1f2933;font-size:12px;cursor:pointer;line-height:22px;padding:0}
  .fold:hover{background:rgba(0,0,0,.18)}
  .chip{background:#fff;border:1px solid #cbd2d9;padding:5px 10px;font-size:12.5px;border-radius:8px;width:235px}
  .chip.endo{border-left:4px solid var(--endo)} .chip.exo{border-left:4px solid var(--exo)}
  .chip.forms{border-left:4px solid var(--forms)} .chip.mix{border-left:4px solid var(--mix)}
  .left .landforms{text-align:right}
  .left .chip{border-left:1px solid #cbd2d9}
  .left .chip.endo{border-right:4px solid var(--endo)}
  .left .chip.mix{border-right:4px solid var(--mix)}

  /* ---------- Notes panel ---------- */
  .notes{width:360px;flex:none;background:#fff;border-left:1px solid #d9dee3;display:flex;flex-direction:column;transition:width .2s}
  .notes.closed{width:44px}
  .notes-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e4e7eb;background:#1f2933;color:#fff;font-weight:700}
  .notes-head button{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;
    width:26px;height:26px;cursor:pointer;font-size:14px}
  .notes-body{padding:18px 18px 24px;overflow:auto;flex:1}
  .notes.closed .notes-body{display:none}
  .notes.closed .notes-head{flex-direction:column;padding:12px 8px;height:100%;justify-content:flex-start}
  .notes.closed .notes-head span{writing-mode:vertical-rl;margin-top:8px}
  .notes.closed .notes-head button{margin:0}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;margin-bottom:10px}
  .badge.endo{background:var(--endo)} .badge.exo{background:var(--exo)} .badge.forms{background:var(--forms)}
  .badge.mix{background:var(--mix)} .badge.root{background:#1f2933}
  .notes h2{font-size:19px;margin:0 0 6px;line-height:1.3}
  .crumb{font-size:12px;color:#7b8794;margin-bottom:14px}
  .notes p{font-size:14.5px;line-height:1.65;margin:0 0 10px}
  .related{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd2d9}
  .related b{font-size:12px;color:#52606d;display:block;margin-bottom:6px}
  .related button{font:inherit;font-size:12.5px;margin:0 6px 6px 0;padding:4px 9px;border-radius:8px;border:1px solid #cbd2d9;background:#f7f9fb;cursor:pointer}
  .related button:hover{background:#eef2f6}
  .placeholder{color:#7b8794;font-size:14px;line-height:1.6}

  @media (max-width:860px){
    .layout{flex-direction:column}
    .notes,.notes.closed{width:100%;height:38vh;border-left:none;border-top:1px solid #d9dee3}
    .notes.closed{height:44px}
    .notes.closed .notes-head{flex-direction:row;height:auto}
    .notes.closed .notes-head span{writing-mode:horizontal-tb;margin:0}
  }
  @media print{
    @page{size:A4 landscape;margin:8mm}
    body{background:#fff} .layout{display:block;height:auto} .main{overflow:visible}
    .notes{display:none}
    .map{transform:scale(.55);transform-origin:top left}
  }
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <h1>რელიეფი: ენდოგენური და ეგზოგენური პროცესები</h1>
    <p class="hint">დააწკაპუნე ნებისმიერ კვადრატზე – განმარტება გამოჩნდება ნოუტების პანელში · ისარი ▾ მალავს/აჩვენებს ფორმებს</p>
    <div class="wrap"><div class="map" id="map"><svg class="links" id="links"></svg></div></div>
  </div>

  <aside class="notes" id="notes">
    <div class="notes-head"><span>📝 ნოუტები</span><button id="toggleNotes" title="პანელის დაკეცვა / გაშლა">⟩</button></div>
    <div class="notes-body" id="notesBody">
      <div class="placeholder">აირჩიე ნებისმიერი ბლოკი მაინდ მეპზე – აქ გამოჩნდება მისი განმარტება.</div>
    </div>
  </aside>
</div>

<script>
const DATA = {
  center: "რელიეფი",
  centerSub: "ლითოსფეროს აგებულება და შემადგენლობა, ენდოგენური და ეგზოგენური პროცესები",
  centerNote:
"დედამიწის ზედაპირი ერთგვაროვანი არ არის. მასზე გვხვდება მთები, ვაკეები, ქვაბულები და ღრმულები და სხვა. ამ უსწორმასწორობათა ერთობლიობა ქმნის დედამიწის რელიეფს. მისი წარმოქმნა განაპირობა დედამიწაზე მოქმედმა შინაგანმა და გარეგანმა ძალებმა, რომელთა მუდმივი მოქმედებით იცვლება რელიეფის იერსახე.\n" +
"გეომორფოლოგია – საბუნებისმეტყველო გეოგრაფიის ნაწილი, რომელიც რელიეფის წარმოქმნას, სტრუქტურასა და განვითარებას სწავლობს (ბერძ. geo – დედამიწა, morphe – ფორმა, logos – სწავლება).\n" +
"გეოლოგია – მეცნიერება, რომელიც შეისწავლის დედამიწის ქერქის აგებულებას, შედგენილობასა და განვითარების თავისებურებებს.",

  groups: [
  // ===================== ENDOGENOUS =====================
  { side:"left", cls:"endo", name:"ენდოგენური პროცესები",
    note:
"შინაგანი, ანუ ენდოგენური ძალები, რომელთა გავლენითაც მოძრაობს დედამიწის ქერქი, რასაც თან ახლავს მთების წარმოქმნა, ვულკანების ამოფრქვევა, მიწისძვრები და სხვა.\n" +
"ენდოგენური და ეგზოგენური პროცესები ურთიერთსაპირისპირო გავლენას ახდენენ რელიეფის ფორმირებაზე. როცა ბირთვისა და მანტიის ქერქზე ზემოქმედებით განპირობებული ენდოგენური პროცესები იწვევს რელიეფის ფორმების ამაღლებას, მაშინ დედამიწის ქერქზე ატმოსფეროს, ჰიდროსფეროსა და ბიოსფეროს ზემოქმედებით განპირობებული ეგზოგენური პროცესების შედეგად რელიეფის ფორმები დაბლდება.",
    factors:[
    { name:"დედამიწის აგებულება", sub:"ბირთვი, მანტია, ქერქი",
      note:"იმისათვის, რომ წარმოვიდგინოთ ენდოგენური შემოქმედების არსი, განვიხილოთ დედამიწის აგებულება. დედამიწის რადიუსი დაახლოებით 6 371 კმ-ის ტოლია. ის შედგება: შიდა და გარე ბირთვების, მანტიისა და ქერქისაგან.",
      chips:[
        ["შიდა ბირთვი","იმყოფება მაღალი წნევის ქვეშ. ის გავარვარებულია და მისი ტემპერატურა 5000°C-ს აჭარბებს. ამ ტემპერატურაზე, ჩვეულებრივ, ყველა ნივთიერება დნება, თუმცა ბირთვის შიდა ნაწილი მყარ მდგომარეობაშია. ამის მიზეზი მაღალი წნევაა. ბირთვის შიდა ნაწილის რადიუსი დაახლოებით 1250 კმ-ის ტოლია."],
        ["გარე ბირთვი","სისქით დაახლოებით 2200 კმ. დედამიწის გარე ბირთვი თხევადია. ბირთვი ძირითადად შედგება რკინისა და ნიკელისაგან."],
        ["მანტია","მოქცეულია დედამიწის ბირთვსა და ქერქს შორის. მისი სისქე დაახლოებით 2900 კმ-ია. მაღალი ტემპერატურისა და წნევის გავლენით მის შემადგენლობაში შემავალი რკინითა და მაგნიუმით გამდიდრებული სილიკატები ბლანტ მასადაა ქცეული და გამუდმებით მოძრაობს დედამიწის ბირთვში არსებული უზარმაზარი ენერგიის გავლენით."],
        ["ქერქი (კონტინენტური და ოკეანური)","დედამიწის ქერქი მყარია და თხელ ფენად 7-70 კმ გარს ეკვრის მანტიას. ოკეანეების ფსკერზე ეს ფენა უფრო თხელია – დაახლოებით 7 კმ. დედამიწის ქერქი არაერთგვაროვანია. არჩევენ კონტინენტურ და ოკეანურ ქერქს."],
        ["გეოთერმული გრადიენტი","გეოთერმული გრადიენტი – დედამიწის ქანების ტემპერატურა სიღრმის მატებასთან ერთად იზრდება, ყოველ 100 მეტრზე 3°-ით, რაც დედამიწის შინაგანი ენერგიითაა გამოწვეული. დედამიწის სიღრმეში ტემპერატურის მატებას გეოთერმული გრადიენტი ჰქვია.\nსქემაზე: ზედაპირზე +25°C, 100 მ-ზე +28°C, 200 მ-ზე +31°C, 300 მ-ზე +34°C."]
      ]},
    { name:"ლითოსფერო", sub:"ქერქი + მანტიის ზედა ფენა",
      note:"ქერქსა და მანტიის ზედა ფენას ერთად ლითოსფერო ჰქვია. ლითოსფერო ბერძნული სიტყვაა და ქვის სფეროს ნიშნავს. მისი სისქე 50-200 კმ-ია. მანტია და ლითოსფერო ერთმანეთთან მყარადაა დაკავშირებული.",
      chips:[
        ["ასთენოსფერო","მანტიის ზედა ნაწილში ასთენოსფერო (ბერძნ. „სუსტი სფერო“) მდებარეობს. მისი ქვედა საზღვარი 250-300 კმ-ია და სწორედ ამ სფეროში წარმოიქმნება ვულკანებისა და მიწისძვრის კერები."],
        ["მოხოროვიჩიჩის ზედაპირი","მოხოროვიჩიჩის ზედაპირი (მოხოროვიჩიჩის საზღვარი) – გამყოფი ზედაპირი დედამიწის ქერქსა და მანტიას შორის, რომელიც დადგენილია სეისმოლოგიური მონაცემებით. საზღვარი აღმოჩენილ იქნა იუგოსლავიელი მეცნიერის ა. მოხოროვიჩიჩის მიერ. დღეს ეს ზედაპირი აღმომჩენის სახელს ატარებს."],
        ["ლითოსფერული ფილები","დედამიწის ქერქი დაყოფილია რამდენიმე ლითოსფერულ ფილად. მაგალითად: ჩრდილოეთ ამერიკის, სამხრეთ ამერიკის, ევრაზიის, აფრიკის, ინდო-ავსტრალიური, ანტარქტიკული, წყნარ-ოკეანური და სხვა.\nეს ფილები დევს ბლანტ და მოძრავ მანტიაზე, ამიტომ ხდება მათი ურთიერთწანაცვლება: ზოგიერთი ფილა ერთმანეთს შორდება, ზოგი ერთმანეთისაკენ მოძრაობს, ზოგჯერ კი ფილები ერთმანეთის მიმართ ჰორიზონტალურად ცურდება."]
      ]},
    { name:"ფილების მოძრაობის შედეგები", sub:"დაშორება და შეჯახება",

        ["ქიმიური გამოფიტვა","განპირობებულია ატმოსფეროში შემავალი ქიმიური ნივთიერებების (ჟანგბადის, ნახშირორჟანგის, წყლის ორთქლის და სხვა) ქანების შემადგენელ მინერალებზე ზემოქმედებით. ამ დროს ხორციელდება ქიმიური რეაქციები, რასაც თან სდევს ქანების დაშლა."],
        ["ბიოლოგიური გამოფიტვა","ხდება ცოცხალი ორგანიზმების ზემოქმედებით, რომელიც შეიძლება ვლინდებოდეს როგორც ფიზიკური, ასევე ქიმიური გამოფიტვის სახით. მაგალითად, ნაპრალში მცენარის თესლის მოხვედრის შემდეგ, მის აღმოცენებასა და ფესვთა სისტემის განვითარებას მოჰყვება ნაპრალის გაფართოება და ქანის დამსხვრევა (ფიზიკური ზემოქმედება). ცხოველები, როგორიცაა თხუნელები და მღრღნელები, სოროების თხრისას შლიან და გადაადგილებენ ნიადაგს. ამ პროცესის შედეგად იცვლება მიწის ზედაპირის ფორმა და თანდათან ყალიბდება ახალი რელიეფი.\nბიოლოგიური გამოფიტვის ერთ-ერთი სახეა ანთროპოგენული (ადამიანის საქმიანობით გამოწვეული) ზემოქმედება."]
      ]},
    { name:"გრავიტაციული რღვევა", sub:"სიმძიმის ძალით გადაადგილება",
      note:"გრავიტაციული რღვევა – გამოფიტული ქანების სიმძიმის ძალის გავლენით გადაადგილება შედარებით მცირე მანძილზე. ის ვლინდება ქვათაცვენის, მეწყერის, ღვარცოფისა და სხვა მსგავსი მოვლენების სახით. გრავიტაციული რღვევა იწყება მაშინ, როცა გამოფიტული ქანების სიმძიმე გადააჭარბებს შემაკავებელ ძალას. ამასთან, რაც უფრო ციცაბოა ფერდობი, მით უფრო მალე ჩამოიშლება ქანები.",
      chips:[
        ["ქვათაცვენა","გამოფიტვის შემდეგ მყარი ქანები იშლება შედარებით მცირე ზომის ფრაგმენტებად და საკუთარი სიმძიმის გავლენით ცვივა – ხდება ქვათაცვენა."],
        ["კლდეზვავი","გრავიტაციულ რელიეფს მიეკუთვნება მეწყრული და კლდეზვავური რელიეფი. გრავიტაციული რელიეფის განვითარებას ხელს უწყობს ღრმად დანაწევრებული და მნიშვნელოვნად დახრილი ფერდობები."],
        ["მეწყერი","მეწყერი წარმოადგენს გრუნტისა და ქანების მასების მოწყვეტას ფერდობზე სიმძიმის ძალის ზემოქმედებით. იგი ვითარდება მაშინ, როდესაც ფერდობის სტაბილურობა ირღვევა, რაც ხშირად დაკავშირებულია ნიადაგის გადაჭარბებულ დატენიანებასთან ძლიერი ნალექების შედეგად.\nგეოლოგიური ფაქტორებია: ნაშალი ქანები, ფერდობის დიდი დაქანება, ბზარებისა და ნაპრალების არსებობა და სეისმური აქტივობა.\nმეტეოროლოგიური ფაქტორებია: ხანგრძლივი და ინტენსიური წვიმები, თოვლის დნობა და მიწის წყლით გაჯერება. პროცესის გააქტიურებას ასევე ხელს უწყობს ტყის გაჩეხვა და არასწორი სამშენებლო საქმიანობა.\nპრევენციისათვის აუცილებელია ფერდობების გამაგრება, დრენაჟული სისტემების მოწყობა, მცენარეული საფარის შენარჩუნება და მეწყერსაშიშ ზონებში მშენებლობის შეზღუდვა."],
        ["ღვარცოფი","ღვარცოფი არის წყლის, ტალახისა და ქვების ნარევის სწრაფი მოძრაობა მდინარის ან ხრამის კალაპოტში. იგი წარმოიქმნება ძლიერი ნალექების, თოვლის სწრაფი დნობის ან მეწყერული პროცესების შედეგად.\nგეოლოგიური ფაქტორებია: ფერდობების დიდი დაქანება, ნაშალი ქანები და ეროზიისადმი მიდრეკილება.\nმეტეოროლოგიური ფაქტორებია: ძლიერი და ხანმოკლე წვიმები, ინტენსიური ნალექები და სწრაფი დათბობა, რაც იწვევს თოვლის დნობას. ღვარცოფი ხასიათდება დიდი სიჩქარითა და დამანგრეველი ძალით.\nპრევენციისათვის გამოიყენება დამცავი ნაგებობები (დამბები, არხები), ტყეების აღდგენა, მიწათსარგებლობის სწორი მართვა და მოსახლეობის დროული გაფრთხილება."]
      ]},
    { name:"წყლისმიერი ეროზია", sub:"ეროზია – გადატანა წყლით",
      note:"ეროზია არის გამოფიტული ქანების შედარებით დიდ მანძილზე გადატანა წყლის, მყინვარებისა და ქარის საშუალებით.\nწყლისმიერი ეროზია – მდინარე გამუდმებით შლის და გამორეცხავს კალაპოტის შემადგენელ ქანებს. ეს პროცესი განსაკუთრებით ძლიერდება წყალდიდობების და წყალმოვარდნების დროს. მდინარეს მოაქვს მონგრეული ქანები. წყლისა და მყარი ნაშალი ქანების ნარევი კიდევ უფრო დამანგრევლად მოქმედებს კალაპოტსა და ნაპირებზე. მდინარეს შორ მანძილებზე გადააქვს.",
      chips:[
        ["ხრამი, ხევი, ხეობა, კანიონი","ეროზიის შედეგად წარმოიქმნება ხაზობრივი გავრცელების მქონე ეროზიული უბნები. ესენია: ხრამი, ხევი, ხეობა, კანიონი და სხვა."]
      ]},
    { name:"აბრაზია", sub:"ზღვისა და ოკეანის ტალღებით",
      note:"აბრაზია – ოკეანეებისა და ზღვის ტალღების მიერ სანაპიროს ნგრევის პროცესია. მის შედეგად წარმოიქმნება აბრაზიული რელიეფის ფორმები: ტერასები (საფეხურების მსგავსი რელიეფის ფორმა), ფლატე (კლიფი) და სხვა.",
      chips:[
        ["ფლატე (კლიფი), ბექობი, ფრიალო კლდე","სანაპირო ბექობი, ფლატე, კლიფი, ფრიალო კლდე წარმოიქმნება აბრაზიული და ეროზიული პროცესებით. ჩვეულებრივ, ფორმირებულია ისეთი ქანების მიერ, რომლებიც მედეგია გამოფიტვისა და ეროზიის მიმართ. კლიფების ამგებელი დანალექი ქანებია ქვიშქვა, კირქვა, ცარცი და დოლომიტი. ხშირად კლიფების ჩამოყალიბებაში მონაწილეობენ აგრეთვე მაგმური ქანებიც, გრანიტი და ბაზალტი."],
        ["ტერასები","ტერასები – საფეხურების მსგავსი რელიეფის ფორმები ზღვის ნაპირებზე. განარჩევენ შემდეგი წარმოშობის ტერასებს: მდინარეულ, ტბიურ, ზღვიურს და შერეულ ტერასებს. ყველაზე მაღალი ტერასა ყველაზე ძველია, დაბალი ყველაზე ახალგაზრდა."]
      ]},
    { name:"ქარისმიერი (ეოლური) ეროზია", sub:"ეროზია – გადატანა ქარით",
      note:"ქარისმიერი ეროზია (ეოლური ეროზია) – ქარის მიერ გამოწვეული ეროზიის შედეგები ნათლადაა გამოხატული უდაბნოებში, სადაც სილისაგან სხვადასხვა ეოლური რელიეფი იქმნება. მაგალითად, დიუნები და ბარხანები. ქარის გამუდმებული მოქმედებით ხდება დაშლილი ქანების გადატანა ერთი ადგილიდან მეორეზე.",
      chips:[
        ["დიუნები","დიუნები – რელიეფის ქარისმიერი ანუ ეოლური ფორმებია, ისინი ქვიშის ზვინულები, ბორცვებია. დიუნების წარმოქმნის საუკეთესო ადგილია მოძრავი ქვიშებით დაფარული ვაკე ადგილები, სადაც ღია ქვიშიანი სივრცე ყოველთვის დაფარულია სხვადასხვა სიდიდისა და ფორმის ბორცვებით.\nმოძრავ დიუნებს დიდი ზიანი მოაქვთ: ისინი ფარავენ მინდვრებს, ბაღებს, სოფლებსა და პატარა ქალაქებსაც კი. მათი მოძრაობის შესაჩერებლად მიმართავენ ე. წ. ქვიშების გამაგრებას, რაც გამოიხატება ძირითადად მასობრივად დანერგილ ხეებსა თუ ბუჩქნარებში. ასეთ შემთხვევაში მცენარეული ფესვები ამაგრებენ ქვიშას და ქარი ვეღარ ახერხებს მათ გადატანას."],
        ["ბარხანი","ბარხანი – დიუნის სახესხვაობაა. ის რელიეფის დადებითი ფორმა, წარმოადგენს უდაბნოს კონტინენტურ დიუნას, ქარით მოტანილსა და მცენარეებით გაუმაგრებელი ფხვიერი ქვიშის ბორცვს. მისთვის დამახასიათებელია ნახევარმთვარისებრი და ნამგლისებური მოხაზულობა."]
      ]},
    { name:"მყინვარული ეროზია", sub:"გლაციალური / ეგზარაციული",
      note:"მყინვარული ეროზია (გლაციალური ეროზია, ეგზარაციული ეროზია) – პროცესი, რომლის დროსაც მყინვარი მოძრაობისას შლის და გადააქვს ქანები. მყინვარი თავისი მასით და მასში ჩართული ქვებით „კაწრავს“ მიწის ზედაპირს, რის შედეგადაც ყალიბდება ხეობები და იცვლება რელიეფი. მყინვარული ეროზია იწვევს ქანების დაშლას და ახალი რელიეფური ფორმების წარმოქმნას.",

    { name:"აკუმულაცია (ალუვიური პროცესი)", sub:"გამოფიტული მასალის დაგროვება",
      note:"აკუმულაცია – გამოფიტული მასალის დაგროვება.\nალუვიური პროცესი – პროცესი, რომლის დროსაც მდინარე გადააქვს და შემდეგ აგროვებს ნალექ მასალას (ქვიშა, თიხა, კენჭები). ეს მასალა ილექება მდინარის კალაპოტში, ნაპირებზე ან დაბლობებში, განსაკუთრებით წყლის სიჩქარის შემცირებისას.",
      chips:[
        ["ალუვიონი","ალუვიონი არის სწორედ ეს დაგროვილი ნალექი – მდინარის მიერ მოტანილი და დალექილი მასალა. ალუვიონი ხშირად ქმნის ნაყოფიერ ნიადაგებს და მნიშვნელოვან როლს ასრულებს დაბლობების ფორმირებაში."],
        ["ჭალა, დელტა, ალუვიური ველები","ალუვიური პროცესის შედეგად ყალიბდება ალუვიური ფორმები, როგორიცაა ჭალა, დელტა და ალუვიური ველები."]
      ]}
    ]},
  ]
};

const COLORS = {endo:'#c0392b', exo:'#1f78b4', forms:'#2f855a', mix:'#6b46c1'};
const TYPE_LABEL = {endo:'ენდოგენური', exo:'ეგზოგენური', forms:'რელიეფის ფორმები', mix:'ენდოგენურ–ეგზოგენური'};

const map = document.getElementById('map');
const svg = document.getElementById('links');
const notesBody = document.getElementById('notesBody');
const notes = document.getElementById('notes');
const links = [];
let selectedEl = null;

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function select(node, info){
  if(selectedEl) selectedEl.classList.remove('selected');
  selectedEl = node; node.classList.add('selected');
  let html = `<span class="badge ${info.cls||'root'}">${esc(info.type)}</span><h2>${esc(info.title)}</h2>`;
  if(info.crumb) html += `<div class="crumb">${esc(info.crumb)}</div>`;
  html += info.text.split('\n').map(p=>`<p>${esc(p)}</p>`).join('');
  if(info.related && info.related.length) html += `<div class="related"><b>${esc(info.relatedLabel)}</b></div>`;
  notesBody.innerHTML = html;
  if(info.related && info.related.length){
    const box = notesBody.querySelector('.related');
    info.related.forEach(r=>{
      const b = el('button',null,esc(r.label));
      b.addEventListener('click',()=>{ r.node.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}); r.node.click(); });
      box.appendChild(b);
    });
  }
  notes.classList.remove('closed');
  document.getElementById('toggleNotes').textContent = '⟩';
  notesBody.scrollTop = 0;
}
function bind(node, getInfo){
  node.tabIndex = 0;
  node.addEventListener('click',()=>select(node, getInfo()));
  node.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); node.click(); }});
}

const center = el('div','node center',esc(DATA.center));
const sides = {left:el('div','side left'), right:el('div','side right')};
const groupRefs = [];

DATA.groups.forEach(g=>{
  const block = el('div','block');
  const group = el('div','node group '+g.cls, esc(g.name));
  const factorsBox = el('div','factors');
  const factorRefs = [];

  g.factors.forEach(f=>{
    const row = el('div','row');
    const fnode = el('div','node factor '+g.cls, esc(f.name)+'<small>'+esc(f.sub)+'</small>');
    const lf = el('div','landforms');
    const chipRefs = f.chips.map(([t,d])=>{
      const c = el('div','node chip '+g.cls, esc(t)); lf.appendChild(c);
      links.push({from:fnode,to:c,side:g.side,cls:g.cls});
      return {node:c,label:t,text:d};
    });
    chipRefs.forEach(cr=>{
      bind(cr.node,()=>({type:'რელიეფის ფორმა / ცნება', cls:g.cls, title:cr.label, crumb:g.name+' › '+f.name, text:cr.text,
        relatedLabel:'დაკავშირებული:',
        related:[{label:f.name+' (ზემოთ)',node:fnode}].concat(chipRefs.filter(x=>x!==cr).map(x=>({label:x.label,node:x.node})))}));
    });
    if(f.chips.length){
      const fold = el('button','fold','▾'); fold.title='დამალვა / ჩვენება';
      fnode.appendChild(fold);
      fold.addEventListener('click',e=>{
        e.stopPropagation();
        const hidden = lf.style.display==='none';
        lf.style.display = hidden ? '' : 'none';
        fnode.classList.toggle('off',!hidden);
        fold.textContent = hidden ? '▾' : '▸';
        draw();
      });
    } else { fnode.style.paddingRight='13px'; }
    bind(fnode,()=>({type:'ფაქტორი / თემა', cls:g.cls, title:f.name, crumb:g.name, text:f.note,
      relatedLabel:'შიგნით:', related:chipRefs.map(x=>({label:x.label,node:x.node}))}));

    if(g.side==='left'){ row.appendChild(lf); row.appendChild(fnode); } else { row.appendChild(fnode); row.appendChild(lf); }
    factorsBox.appendChild(row);
    factorRefs.push({node:fnode,label:f.name});
    links.push({from:group,to:fnode,side:g.side,cls:g.cls});
  });

  bind(group,()=>({type:TYPE_LABEL[g.cls], cls:g.cls, title:g.name, crumb:DATA.center, text:g.note,
    relatedLabel:'თემები:', related:factorRefs.map(x=>({label:x.label,node:x.node}))}));
  groupRefs.push({node:group,label:g.name});
  links.push({from:center,to:group,side:g.side,cls:g.cls});

  if(g.side==='left'){ block.appendChild(factorsBox); block.appendChild(group); }
  else { block.appendChild(group); block.appendChild(factorsBox); }
  sides[g.side].appendChild(block);
});

bind(center,()=>({type:'მთავარი თემა', title:DATA.center, crumb:DATA.centerSub, text:DATA.centerNote,
  relatedLabel:'ძირითადი ბლოკები:', related:groupRefs.map(x=>({label:x.label,node:x.node}))}));

map.appendChild(sides.left); map.appendChild(center); map.appendChild(sides.right);

function draw(){
  svg.innerHTML='';
  const base = map.getBoundingClientRect();
  links.forEach(l=>{
    if(l.to.offsetParent===null) return;
    const a = l.from.getBoundingClientRect(), b = l.to.getBoundingClientRect();
    let x1,x2;
    if(l.side==='left'){ x1=a.left-base.left; x2=b.right-base.left; }
    else { x1=a.right-base.left; x2=b.left-base.left; }
    const y1=a.top+a.height/2-base.top, y2=b.top+b.height/2-base.top;
    const mx=(x1+x2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute('stroke', COLORS[l.cls]);
    svg.appendChild(p);
  });
}

document.getElementById('toggleNotes').addEventListener('click',()=>{
  notes.classList.toggle('closed');
  document.getElementById('toggleNotes').textContent = notes.classList.contains('closed') ? '⟨' : '⟩';
});
window.addEventListener('load',draw);
window.addEventListener('resize',draw);
document.fonts && document.fonts.ready.then(draw);
setTimeout(draw,200);
</script>
</body>
</html>
